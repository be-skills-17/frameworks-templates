name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Manual checkout - Gitea act_runner does NOT auto-checkout code
    - name: Checkout repository
      env:
        GIT_USER: ${{ secrets.USER }}
        GIT_PASS: ${{ secrets.PASS }}
      run: |
        git clone --depth 1 http://${GIT_USER}:${GIT_PASS}@gitea:3000/${{ github.repository }}.git .
        git checkout ${{ github.sha }}

    # Unix-time based version so WUD detects a higher semver tag on every build
    - name: Generate Version Tag
      run: |
        UNIX_TAG="1.0.$(date +%s)"
        echo "BUILD_VERSION=$UNIX_TAG" >> $GITHUB_ENV
        echo "Generated version: $UNIX_TAG"

    - name: Build the Docker image
      id: build
      continue-on-error: true
      env:
        DOMAIN: ${{ secrets.DOMAIN }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        APP_URL: ${{ secrets.APP_URL }}
        NPM_REGISTRY: ${{ secrets.NPM_REGISTRY_URL }}
        COMPOSER_PROXY: ${{ secrets.COMPOSER_PROXY_URL }}
      run: |
        IMAGE_BASE="git.${DOMAIN}/${{ github.repository }}"
        echo "Building $IMAGE_BASE:latest and $IMAGE_BASE:${{ env.BUILD_VERSION }}"

        DOCKER_BUILDKIT=0 docker build \
          --network gitea \
          --add-host=db.${DOMAIN}:${SERVER_IP} \
          --build-arg DB_HOST=${DB_HOST} \
          --build-arg DB_NAME=${DB_NAME} \
          --build-arg DB_USERNAME=${DB_USERNAME} \
          --build-arg DB_PASSWORD=${DB_PASSWORD} \
          --build-arg APP_URL=${APP_URL} \
          --build-arg COMPOSER_PROXY=${COMPOSER_PROXY} \
          --build-arg NPM_REGISTRY=${NPM_REGISTRY} \
          . --file Dockerfile \
          --tag ${IMAGE_BASE}:latest \
          --tag ${IMAGE_BASE}:${{ env.BUILD_VERSION }}

    - name: Build error page on failure
      if: steps.build.outcome == 'failure'
      env:
        DOMAIN: ${{ secrets.DOMAIN }}
      run: |
        IMAGE_BASE="git.${DOMAIN}/${{ github.repository }}"
        mkdir -p /tmp/error-page
        cd /tmp/error-page
        cat > Dockerfile << 'EOF'
        FROM nginx:alpine
        RUN echo '<html><head><style>body{font-family:system-ui;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#1a1a2e;color:#fff}.container{text-align:center;padding:2rem;border-radius:10px;background:#16213e;box-shadow:0 0 20px rgba(0,0,0,0.5)}h1{color:#e94560;margin:0 0